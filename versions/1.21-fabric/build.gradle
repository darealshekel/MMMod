plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

apply from: '../../gradle/release-version.gradle'
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    include "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_dependency", project.findProperty("minecraft_dependency") ?: project.minecraft_version

    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "minecraft_dependency": project.findProperty("minecraft_dependency") ?: project.minecraft_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Opt-in checks in an isolated game directory, excluded from release jars.
if (project.hasProperty('smokeTest')) {
    loom.runs.client.runDir('build/core-smoke-game')
    sourceSets {
        smoke {
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
    }
    loom.mods {
        smoke { sourceSet sourceSets.smoke }
    }
    if (project.hasProperty('growthSmoke')) {
        loom.runs.client.runDir('run-growth-smoke')
    }
    if (project.hasProperty('reliabilitySmoke')) {
        loom.runs.client.runDir('run-reliability-smoke')
    }
    tasks.named('runClient') {
        maxHeapSize = '2G'
        dependsOn tasks.named('smokeClasses')
        classpath += sourceSets.smoke.output
        environment 'APPDATA', file(project.hasProperty('growthSmoke') ? 'build/growth-smoke-appdata' : 'build/smoke-appdata').absolutePath
        jvmArgs '-Duser.home=' + file(project.hasProperty('growthSmoke') ? 'build/growth-smoke-home' : 'build/smoke-home').absolutePath
        if (project.hasProperty('leaderboardSmoke')) jvmArgs '-Dmmm.leaderboardSmoke=true'
        if (project.hasProperty('miningFeaturesSmoke')) jvmArgs '-Dmmm.miningFeaturesSmoke=true'
        if (project.hasProperty('breakingIndicatorSmoke')) jvmArgs '-Dmmm.breakingIndicatorSmoke=true'
        if (project.hasProperty('playtimeSmoke')) jvmArgs '-Dmmm.playtimeSmoke=true'
        if (project.hasProperty('growthSmoke')) jvmArgs '-Dmmm.growthSmoke=true'
        if (project.hasProperty('reliabilitySmoke')) jvmArgs '-Dmmm.reliabilitySmoke=true'
    }
}

apply from: '../../gradle/shared-sources.gradle'
